on:
  push:
    branches:
      - master
  pull_request:

name: unit-tests

jobs:

  test:

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
        go-version:
          - "1.21.x"
          - "1.22.x"
          - "1.23.x"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Run target
        run: make test
